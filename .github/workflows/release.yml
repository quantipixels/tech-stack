name: Release
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show the planned version and changelog without committing
        type: boolean
        default: true
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/ori'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The version commit is pushed to ori; credentials are removed below.
          persist-credentials: true # zizmor: ignore[artipacked] -- needed to push the version commit
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: mise run release:deps
      - run: mise run release:version
      - name: Commit the version, or report the plan
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if git diff --quiet; then
            echo "No changesets to release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version=$(node -p 'require("./package.json").version')
          {
            echo "## tech-stack $version"
            git diff -U0 -- CHANGELOG.md | sed -n 's/^+\([^+]\)/\1/p'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: nothing committed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changeset CHANGELOG.md package.json package-lock.json plugin/.claude-plugin plugin/.codex-plugin
          git commit -m "chore: release v$version"
          # Fails if ori moved since checkout; rerun the release.
          git push origin HEAD:ori
      - name: Remove runner credentials
        if: always()
        run: |
          rm -f "$HOME/.netrc"
          git config --local --unset-all http.https://github.com/.extraheader || true
