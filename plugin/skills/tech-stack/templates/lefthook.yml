# Hooks call tools pinned in mise.toml and mise tasks only.
pre-commit:
  parallel: true
  commands:
    # The stack formatters/linters on {staged_files}, e.g. `vp fmt --check`, `mix format --check-formatted`.
    # Secret, dependency and workflow scans run in CI, not here.

pre-push:
  commands:
    gate:
      # Clear git's hook variables so test fixtures cannot reach this repo.
      run: |
        for git_var in $(env | sed -n 's/^\(GIT_[A-Za-z_]*\)=.*/\1/p'); do unset "$git_var"; done
        mise run check   # runs once per tree, writes the evidence record and the PR body block
    private-names:
      # Your own list of private names, one per line, outside every repository; public or unknown-visibility remotes only.
      run: |
        list="${PRIVATE_NAMES_FILE:-$HOME/.config/private-names}"
        [ -s "$list" ] || exit 0
        [ "$(gh repo view --json visibility -q .visibility 2>/dev/null)" = PRIVATE ] && exit 0
        for c in $(git rev-list --branches --not --remotes); do
          if git show --format=%B "$c" | LC_ALL=C.UTF-8 grep -qiFf "$list"; then
            echo "Commit $c names a private term in its message or diff; refer to it by role."; exit 1
          fi
        done

commit-msg:
  # Match the repo's established commit pattern; this is Conventional Commits for a repo without one.
  commands:
    conventional:
      run: |
        grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+' {1}

# Refresh tools and dependencies only when a lockfile or mise.toml changed.
post-merge:
  commands:
    deps:
      files: git diff --name-only HEAD@{1} HEAD
      glob: "{mise.toml,**/mix.lock,**/pnpm-lock.yaml,**/Cargo.lock}"
      run: mise install && mise run deps

post-checkout:
  commands:
    deps:
      files: git diff --name-only {1} {2}
      glob: "{mise.toml,**/mix.lock,**/pnpm-lock.yaml,**/Cargo.lock}"
      run: mise install && mise run deps
