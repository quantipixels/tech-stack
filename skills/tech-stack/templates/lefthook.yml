# Hooks call tools pinned in mise.toml and mise tasks only.
pre-commit:
  parallel: true
  commands:
    # The stack formatters/linters on {staged_files}, e.g. `vp fmt --check`, `mix format --check-formatted`.
    # Secret, dependency and workflow scans run in CI, not here.

pre-push:
  commands:
    gate:
      # Clear git's hook variables so test fixtures cannot reach this repo.
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE mise run check

commit-msg:
  # Match the repo's established commit pattern; this is Conventional Commits for a repo without one.
  commands:
    conventional:
      run: |
        grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+' {1}

# Refresh tools and dependencies only when a lockfile or mise.toml changed.
post-merge:
  commands:
    deps:
      files: git diff --name-only HEAD@{1} HEAD
      glob: "{mise.toml,**/mix.lock,**/pnpm-lock.yaml,**/Cargo.lock}"
      run: mise install && mise run deps

post-checkout:
  commands:
    deps:
      files: git diff --name-only {1} {2}
      glob: "{mise.toml,**/mix.lock,**/pnpm-lock.yaml,**/Cargo.lock}"
      run: mise install && mise run deps
