# Hooks call tools pinned in mise.toml and mise tasks only.
pre-commit:
  parallel: true
  commands:
    secrets:
      run: mise exec -- gitleaks git --staged --no-banner
    shell:
      glob: "*.sh"
      run: mise exec -- shellcheck {staged_files}
    dockerfiles:
      glob: "*Dockerfile*"
      run: mise exec -- hadolint {staged_files}
    workflows:
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- actionlint {staged_files}
    # Add the stack formatters/linters on {staged_files}, e.g. `vp fmt --check`, `mix format --check-formatted`.

pre-push:
  commands:
    gate:
      run: mise run check

commit-msg:
  commands:
    conventional:
      run: |
        grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+' {1}

# Refresh tools and dependencies only when a lockfile or mise.toml changed.
post-merge:
  commands:
    deps:
      files: git diff --name-only HEAD@{1} HEAD
      glob: "{mise.toml,**/mix.lock,**/pnpm-lock.yaml,**/Cargo.lock}"
      run: mise install && mise run deps

post-checkout:
  commands:
    deps:
      files: git diff --name-only {1} {2}
      glob: "{mise.toml,**/mix.lock,**/pnpm-lock.yaml,**/Cargo.lock}"
      run: mise install && mise run deps
